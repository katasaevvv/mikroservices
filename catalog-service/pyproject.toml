[project]
name = "catalog-service"
version = "0.1.0"
description = "Asynchronous catalog service for the order processing system"
requires-python = ">=3.13,<3.15"
dependencies = [
    "aio-pika>=9,<10",
    "aioboto3",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "pillow>=12.3.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=7.1.0",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalog_service"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a dedicated PostgreSQL database named *_test",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["catalog_service"]
