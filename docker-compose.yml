x-order-service: &order-service
  image: messaging-lab-order-service:local
  build:
    context: ./order-service
  env_file:
    - ./order-service/.env
  environment:
    POSTGRESQL_HOST: order-postgres
    POSTGRESQL_PORT: 5432
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_ANALYTICS_TOPIC: ${KAFKA_ANALYTICS_TOPIC}
    JWT_PUBLIC_KEY_PATH: /run/secrets/auth_jwt_public.pem
    CATALOG_BASE_URL: http://catalog-api:8000
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  restart: unless-stopped

x-analytics-service: &analytics-service
  image: analytics-service:local
  build:
    context: ./analytics-service
  env_file: ./analytics-service/.env
  environment:
    POSTGRESQL_HOST: analytics-postgres
    POSTGRESQL_PORT: 5432
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_ANALYTICS_TOPIC: ${KAFKA_ANALYTICS_TOPIC}
    KAFKA_ANALYTICS_DLQ_TOPIC: ${KAFKA_ANALYTICS_DLQ_TOPIC}
    KAFKA_CONSUMER_GROUP: ${KAFKA_ANALYTICS_CONSUMER_GROUP}
    JWT_PUBLIC_KEY_PATH: /run/secrets/auth_jwt_public.pem
  restart: unless-stopped

x-payment-service: &payment-service
  image: payment-service:local
  build:
    context: ./payment-service
  env_file: ./payment-service/.env
  environment:
    POSTGRESQL_HOST: payment-postgres
    POSTGRESQL_PORT: 5432
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    JWT_PUBLIC_KEY_PATH: /run/secrets/auth_jwt_public.pem
  restart: unless-stopped

x-catalog-service: &catalog-service
  image: catalog-service:local
  build:
    context: ./catalog-service
  env_file: ./catalog-service/.env
  environment: &catalog-env
    POSTGRESQL_HOST: catalog-postgres
    POSTGRESQL_PORT: 5432
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    REDIS_URL: ${REDIS_URL}
    JWT_PUBLIC_KEY_PATH: /run/secrets/auth_jwt_public.pem
  restart: unless-stopped

x-auth-service: &auth-service
  image: auth-service:local
  build:
    context: ./auth-service
  env_file: ./auth-service/.env
  environment:
    POSTGRESQL_HOST: auth-postgres
    POSTGRESQL_PORT: 5432
    REDIS_URL: ${REDIS_URL}
  volumes:
    - ./auth-service/secrets:/app/secrets:ro
  restart: unless-stopped

x-api-gateway: &api-gateway
  image: api-gateway:local
  build:
    context: ./api-gateway
  env_file:
    - ./api-gateway/.env
  environment:
    GATEWAY_JWT_PUBLIC_KEY_PATH: /run/secrets/auth_jwt_public.pem
    GATEWAY_AUTH_BASE_URL: http://auth-api:8000
    GATEWAY_CATALOG_BASE_URL: http://catalog-api:8000
    GATEWAY_ORDERS_BASE_URL: http://order-api:8000
    GATEWAY_ANALYTICS_BASE_URL: http://analytics-api:8000
    GATEWAY_PAYMENT_BASE_URL: http://payment-api:8000
  restart: unless-stopped


services:
  order-migrations:
    <<: *order-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      order-postgres:
        condition: service_healthy
    restart: "no"

  analytics-migrations:
    <<: *analytics-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      analytics-postgres:
        condition: service_healthy
    restart: "no"

  payment-migrations:
    <<: *payment-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      payment-postgres:
        condition: service_healthy
    restart: "no"

  catalog-migrations:
    <<: *catalog-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      catalog-postgres:
        condition: service_healthy
    restart: "no"

  auth-migrations:
    <<: *auth-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      auth-postgres:
        condition: service_healthy
    restart: "no"


  order-api:
    <<: *order-service
    command: ["python", "-m", "uvicorn", "messaging_lab.api:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - 8000
    volumes:
      - ./auth-service/secrets/jwt_public.pem:/run/secrets/auth_jwt_public.pem:ro
    depends_on:
      order-migrations:
        condition: service_completed_successfully
  analytics-api:
    <<: *analytics-service
    command: ["python", "-m", "uvicorn", "analytics_service.api:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - 8000
    volumes:
      - ./auth-service/secrets/jwt_public.pem:/run/secrets/auth_jwt_public.pem:ro
    depends_on:
      analytics-migrations:
        condition: service_completed_successfully

  payment-api:
    <<: *payment-service
    command: ["python", "-m", "uvicorn", "payment_service.api:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - 8000
    volumes:
      - ./auth-service/secrets/jwt_public.pem:/run/secrets/auth_jwt_public.pem:ro
    depends_on:
      payment-migrations:
        condition: service_completed_successfully
  catalog-api:
    <<: *catalog-service
    command: ["python", "-m", "uvicorn", "catalog_service.api:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
     - 8000
    environment:
      <<: *catalog-env
      S3_ENDPOINT_URL: http://weed-mini:8333
      S3_BUCKET: ${S3_BUCKET}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    volumes:
      - ./auth-service/secrets/jwt_public.pem:/run/secrets/auth_jwt_public.pem:ro
    depends_on:
      catalog-migrations:
        condition: service_completed_successfully

  auth-api:
    <<: *auth-service
    command: ["python", "-m", "uvicorn", "auth_service.api:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - 8000
    depends_on:
      auth-migrations:
        condition: service_completed_successfully
  
  api-gateway:
    <<: *api-gateway
    command: ["python", "-m", "uvicorn", "api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - 8000
    volumes:
      - ./auth-service/secrets/jwt_public.pem:/run/secrets/auth_jwt_public.pem:ro
  

  order-publisher:
    <<: *order-service
    command: ["python", "-m", "messaging_lab.workers.rabbitmq_outbox_publisher"]
    depends_on:
      order-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy 

  order-stock_reservation-results:
    <<: *order-service
    command: ["python", "-m", "messaging_lab.workers.stock_reservation_result"]
    depends_on:
      order-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  kafka-publisher:
    <<: *order-service
    command: ["python", "-m", "messaging_lab.workers.kafka_outbox_publisher"]
    depends_on:
      order-migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      

  notifications-consumer:
    <<: *order-service
    command: ["python", "-m", "messaging_lab.workers.notifications"]
    depends_on:
      order-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
  order-payment-results:
    <<: *order-service
    command: ["python", "-m", "messaging_lab.workers.payment_results"]
    depends_on:
      order-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
  payment-handler:
    <<: *payment-service
    command: ["python", "-m", "payment_service.workers.payment_handler"]
    depends_on:
      payment-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
  
  payment-execution-worker:
    <<: *payment-service
    command: ["python", "-m", "payment_service.workers.payment_execution"]
    depends_on:
      payment-migrations:
        condition: service_completed_successfully
  
  payment-outbox-publisher:
    <<: *payment-service
    command: ["python", "-m", "payment_service.workers.rabbitmq_outbox_publisher"]
    depends_on:
      payment-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
  
  catalog-reservation-consumer:
    <<: *catalog-service
    command: ["python", "-m", "catalog_service.workers.reservation_commands"]
    depends_on:
      catalog-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  catalog-reservation-publisher:
    <<: *catalog-service
    command: ["python", "-m", "catalog_service.workers.rabbitmq_outbox_publisher"]
    depends_on:
      catalog-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  catalog-finalization-consumer:
    <<: *catalog-service
    command: ["python", "-m", "catalog_service.workers.reservation_finalization"]
    depends_on:
      catalog-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  analytics-consumer:
    <<: *analytics-service
    command: ["python", "-m", "analytics_service.workers.kafka_consumer"]
    depends_on:
      analytics-migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: service_rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    
    restart: unless-stopped
  
  order-postgres:
    image: postgres:15-alpine
    container_name: order_postgres
    environment:
      POSTGRES_USER: ${ORDER_POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${ORDER_POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${ORDER_POSTGRESQL_DB}
    ports:
      - "127.0.0.1:${ORDER_POSTGRESQL_PORT}:5432"
    volumes:
      - orders_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_POSTGRESQL_USER} -d ${ORDER_POSTGRESQL_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  analytics-postgres:
    image: postgres:15-alpine
    container_name: analytics_postgres
    environment:
      POSTGRES_USER: ${ANALYTICS_POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${ANALYTICS_POSTGRESQL_DB}
    ports:
      - "127.0.0.1:${ANALYTICS_POSTGRESQL_PORT}:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_POSTGRESQL_USER} -d ${ANALYTICS_POSTGRESQL_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped
  
  payment-postgres:
    image: postgres:15-alpine
    container_name: payment_postgres
    environment:
      POSTGRES_USER: ${PAYMENTS_POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${PAYMENTS_POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${PAYMENTS_POSTGRESQL_DB}
    ports:
      - "127.0.0.1:${PAYMENTS_POSTGRESQL_PORT}:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENTS_POSTGRESQL_USER} -d ${PAYMENTS_POSTGRESQL_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  catalog-postgres:
    image: postgres:15-alpine
    container_name: catalog_postgres
    environment:
      POSTGRES_USER: ${CATALOG_POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${CATALOG_POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${CATALOG_POSTGRESQL_DB}
    ports:
      - "127.0.0.1:${CATALOG_POSTGRESQL_PORT}:5432"
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_POSTGRESQL_USER} -d ${CATALOG_POSTGRESQL_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
  auth-postgres:
    image: postgres:15-alpine
    container_name: auth_postgres
    environment:
      POSTGRES_USER: ${AUTH_POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRESQL_DB}
    ports:
      - "127.0.0.1:${AUTH_POSTGRESQL_PORT}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRESQL_USER} -d ${AUTH_POSTGRESQL_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  kafka:
    image: apache/kafka:4.1.1
    container_name: service_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: "${KAFKA_NUM_PARTITIONS}"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT}:29092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic "${KAFKA_ANALYTICS_TOPIC}" \
          --partitions "${KAFKA_ANALYTICS_PARTITIONS}" \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic "${KAFKA_ANALYTICS_DLQ_TOPIC}" \
          --partitions "${KAFKA_ANALYTICS_DLQ_PARTITIONS}" \
          --replication-factor 1
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    restart: unless-stopped

  weed-mini:
    image: chrislusf/seaweedfs:4.47
    environment:
      S3_BUCKET: ${S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - product_media_data:/data
    command: ["mini", "-dir=/data"]
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-gui:
    image: redis/redisinsight
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  
  loki:
    image: grafana/loki:3.7.0
    volumes:
      - ./infra/monitoring/loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/config.yaml"]
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.0
    volumes:
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    volumes: 
      - ./infra/monitoring/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    ports:
    - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.3
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

volumes:
  rabbitmq_data:
  kafka_data:
  redis_data:
  orders_postgres_data:
  analytics_postgres_data:
  payment_postgres_data:
  catalog_postgres_data:
  auth_postgres_data:
  loki_data:
  alloy_data:
  grafana_data:
  prometheus_data:
  product_media_data:
  
    
